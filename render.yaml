services:
  - type: web
    name: compileai-backend
    env: python
    region: ohio
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.6
      - key: OPENAI_API_KEY
        sync: false # You will need to input this manually in the Render Dashboard
